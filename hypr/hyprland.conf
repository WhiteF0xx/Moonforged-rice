# ==========================================
# Hyprland - Moonforge configuration
# Portable monitor detection
# ==========================================

# Automatically use the preferred mode on connected monitors.
# Replace this with explicit monitor rules if you need custom positioning or scaling.
monitor = , preferred, auto, 1

# Applications
$terminal = kitty

# Environment
# Start with the existing working NVIDIA driver.
# Add further NVIDIA-specific workarounds only if needed.

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(45475aff)

    layout = dwindle
}

# Window decoration
decoration {
    rounding = 8
}

# Basic animationsS
animations {
    enabled = yes
}

# Keyboard layout
input {
    kb_layout = us
    follow_mouse = 1
}

# Essential keybindings
$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, SPACE, exec, fuzzel
bind = $mainMod SHIFT, S, exec, flameshot gui

# Focus windows
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to workspaces 1-5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Authentication agent
exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = sh -c 'sleep 1; awww img "$HOME/.config/moonforge/wallpaper.jpg"'
